<style>
  :root{
    --bg:#0b0a08; --panel:#141210; --panel-2:#1c1916;
    --amber:#ffb000; --amber-dim:#b8801f; --line:#2a251e;
    --muted:#8a7f6a; --text:#f3e7cf; --danger:#ff5f56; --ok:#7ec96b;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:"JetBrains Mono","Gowun Dodum",monospace; line-height:1.5; min-height:100vh; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:1080px; margin:0 auto; padding:24px 16px 48px; }
  header{ margin-bottom:20px; position:relative; }
  .brand{ font-size:12px; letter-spacing:.28em; color:var(--amber-dim); text-transform:uppercase; }
  h1{ font-size:clamp(22px,4vw,32px); margin:6px 0; color:var(--amber); font-weight:700; text-shadow:0 0 14px rgba(255,176,0,.25); }
  .sub{ color:var(--muted); font-size:13px; margin:0; }
  .sub b{ color:var(--amber-dim); font-weight:500; }
  .langtoggle{ position:absolute; top:0; right:0; display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .langtoggle button{ padding:6px 14px; font-size:12px; color:var(--muted); background:var(--panel-2); border:none; cursor:pointer; font-family:inherit; }
  .langtoggle button + button{ border-left:1px solid var(--line); }
  .langtoggle button.active{ background:var(--amber); color:#1a1304; font-weight:700; }
  @media (max-width:560px){ .langtoggle{ position:static; margin-bottom:10px; } }
  html.embedded body{ min-height:0; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:820px){ .grid{ grid-template-columns:1fr; } }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; min-width:0; }
  .panel h2{ font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--amber-dim); margin:0 0 14px; font-weight:700; }
  .drop{ border:2px dashed var(--line); border-radius:10px; background:var(--panel-2); padding:30px 16px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s; user-select:none; }
  .drop:hover, .drop.drag{ border-color:var(--amber); background:#211b12; }
  .drop .ico{ font-size:30px; color:var(--amber); }
  .drop .big{ display:block; margin-top:8px; font-size:14px; }
  .drop .small{ display:block; margin-top:4px; color:var(--muted); font-size:12px; }
  .field{ margin-top:18px; }
  .field > label{ display:block; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:7px; }
  .modes{ display:grid; gap:8px; }
  .mode{ display:flex; gap:10px; align-items:flex-start; padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel-2); cursor:pointer; }
  .mode input{ margin-top:3px; accent-color:var(--amber); }
  .mode.active{ border-color:var(--amber); box-shadow:0 0 0 1px rgba(255,176,0,.25); }
  .mode b{ display:block; font-size:14px; color:var(--text); font-weight:700; }
  .mode span{ display:block; font-size:12px; color:var(--muted); margin-top:2px; }
  .seg{ display:flex; gap:8px; }
  .seg button{ flex:1; background:var(--panel-2); color:var(--muted); border:1px solid var(--line); border-radius:7px; padding:10px 0; font-family:inherit; font-size:13px; cursor:pointer; }
  .seg button.active{ background:var(--amber); color:#1a1304; border-color:var(--amber); font-weight:700; }
  .hint{ margin-top:8px; font-size:12px; color:var(--muted); }
  .btn{ margin-top:16px; width:100%; padding:13px; border-radius:8px; background:var(--amber); color:#1a1304; border:none; cursor:pointer; font-family:inherit; font-size:15px; font-weight:700; }
  .btn:disabled{ background:var(--line); color:var(--muted); cursor:not-allowed; }
  .btn.ghost{ background:transparent; color:var(--amber); border:1px solid var(--amber-dim); margin-top:10px; }
  .privacy{ margin-top:16px; font-size:12px; color:var(--muted); text-align:center; border:1px dashed var(--line); border-radius:8px; padding:10px; }
  .privacy b{ color:var(--amber-dim); }
  .preview{ border:1px solid var(--line); border-radius:10px; min-height:220px; display:flex; align-items:center; justify-content:center; background:var(--panel-2); overflow:hidden; }
  .preview canvas{ max-width:100%; max-height:340px; display:block; background:#fff; }
  .empty{ color:var(--muted); font-size:13px; text-align:center; padding:24px; }
  .bar{ height:8px; background:var(--line); border-radius:6px; overflow:hidden; margin-top:14px; display:none; }
  .bar > i{ display:block; height:100%; width:0; background:var(--amber); transition:width .15s; }
  .status{ margin-top:8px; font-size:12px; color:var(--muted); min-height:18px; }
  .info{ margin-top:14px; border-top:1px solid var(--line); padding-top:12px; display:none; }
  .row{ display:flex; justify-content:space-between; gap:14px; font-size:13px; padding:4px 0; }
  .row .k{ color:var(--muted); }
  .row .v{ text-align:right; word-break:break-all; }
  .down{ color:var(--ok); font-weight:700; }
  .up{ color:var(--danger); font-weight:700; }
  .err{ margin-top:12px; padding:10px 12px; border:1px solid var(--danger); border-radius:7px; background:rgba(255,95,86,.08); color:var(--danger); font-size:13px; display:none; }
  .err.show{ display:block; }
  .note{ margin-top:12px; padding:10px 12px; border:1px solid var(--amber-dim); border-radius:7px; color:var(--text); font-size:13px; display:none; }
  .note.show{ display:block; }
  select, input[type="number"]{ background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:7px; font-family:inherit; font-size:14px; padding:10px 12px; width:100%; }
  select:focus, input:focus{ outline:none; border-color:var(--amber); }
  .btn.part{ margin-top:8px; padding:10px; font-size:13px; }
  .btn.part.over{ background:var(--danger); color:#1a0604; }

<body>
<div class="wrap">
  <header>
    <div class="langtoggle" id="langToggle">
      <button type="button" data-lang="ko" class="active">KR</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <div class="brand">CODINGNOW · PDF TOOL</div>
    <h1 data-i18n="title">PDF 용량 줄이기</h1>
    <p class="sub"><span data-i18n="sub">PDF 압축 —</span> <b data-i18n="subBold">브라우저에서 처리, 업로드 없음</b></p>
  </header>

  <div class="grid">
    <section class="panel">
      <h2 data-i18n="pIn">입력 · 설정</h2>
      <div class="drop" id="drop" tabindex="0" role="button">
        <div class="ico">⬆</div>
        <span class="big" data-i18n="dropBig">PDF 를 끌어다 놓거나 클릭해 선택</span>
        <span class="small" id="dropSmall">.pdf</span>
      </div>
      <input type="file" id="file" accept="application/pdf,.pdf" hidden />

      <div class="field">
        <label data-i18n="lMode">방식</label>
        <div class="modes" id="modes">
          <label class="mode active"><input type="radio" name="mode" value="images" checked />
            <div><b data-i18n="m1">글자 그대로 · 사진만 다시 압축</b><span data-i18n="m1d">글자 선택·검색이 그대로 됩니다. 사진·스캔 이미지가 많을수록 많이 줄어듭니다.</span></div></label>
          <label class="mode"><input type="radio" name="mode" value="raster" />
            <div><b data-i18n="m2">강하게 · 페이지를 이미지로</b><span data-i18n="m2d">스캔본에 효과가 큽니다. 대신 글자를 선택·검색할 수 없게 됩니다.</span></div></label>
        </div>
      </div>

      <div class="field">
        <label data-i18n="lLevel">압축 정도</label>
        <div class="seg" id="levels">
          <button type="button" data-level="light" data-i18n="lv1">약하게</button>
          <button type="button" data-level="medium" class="active" data-i18n="lv2">보통</button>
          <button type="button" data-level="strong" data-i18n="lv3">강하게</button>
        </div>
        <div class="hint" id="levelHint"></div>
      </div>

      <div class="field">
        <label data-i18n="lLimit">용량 제한</label>
        <select id="limit">
          <option value="" data-i18n="limNone">제한 없음</option>
          <option value="10">10 MB</option>
          <option value="8">8 MB</option>
          <option value="5">5 MB</option>
          <option value="3">3 MB</option>
          <option value="2">2 MB</option>
          <option value="1">1 MB</option>
          <option value="custom" data-i18n="limCustom">직접 입력 (MB)</option>
        </select>
        <input type="number" id="limitCustom" min="0.1" step="0.1" placeholder="MB" style="display:none;margin-top:8px" />
        <div class="hint" data-i18n="limitHint">보험 청구·관공서 서류처럼 올릴 수 있는 크기가 정해져 있을 때 고르세요. 줄여도 넘으면 쪽 단위로 나눠 줍니다.</div>
      </div>

      <button class="btn" id="run" data-i18n="run" disabled>PDF 줄이기</button>
      <div class="privacy" data-i18n-html="privacy">🔒 PDF 는 <b>이 브라우저 안에서만</b> 처리됩니다. 서버나 다른 어떤 곳으로도 <b>보내지 않습니다</b>. 도구가 열린 뒤에는 인터넷을 끊어도 동작합니다.</div>
    </section>

    <section class="panel">
      <h2 data-i18n="pOut">결과</h2>
      <div class="preview" id="preview"><div class="empty" id="empty" data-i18n="waiting">PDF 를 기다리는 중…</div></div>
      <div class="bar" id="bar"><i id="barFill"></i></div>
      <div class="status" id="status"></div>
      <div class="info" id="info">
        <div class="row"><span class="k" data-i18n="iName">파일</span><span class="v" id="iName">—</span></div>
        <div class="row"><span class="k" data-i18n="iPages">페이지</span><span class="v" id="iPages">—</span></div>
        <div class="row"><span class="k" data-i18n="iOrig">원래 크기</span><span class="v" id="iOrig">—</span></div>
        <div class="row"><span class="k" data-i18n="iNew">줄인 크기</span><span class="v" id="iNew">—</span></div>
        <div class="row"><span class="k" data-i18n="iDelta">변화</span><span class="v" id="iDelta">—</span></div>
        <div class="row"><span class="k" data-i18n="iDone">처리</span><span class="v" id="iDone">—</span></div>
      </div>
      <div class="note" id="note"></div>
      <button class="btn" id="download" data-i18n="download" disabled>줄인 PDF 다운로드</button>
      <div id="parts"></div>
      <button class="btn ghost" id="reset" data-i18n="reset" style="display:none">다른 PDF</button>
      <div class="err" id="err"></div>
    </section>
  </div>
</div>

<script src="vendor/pdf-lib.min.js"></script>

      if (frac > worst) { worst = frac; worstPage = from + i; }
    }
    // 화소의 15% 넘게 크게 달라진 쪽이 있으면 깨진 것으로 본다(사진 재압축·래스터화는 보통 1% 안팎)
    return { ok: worst <= 0.15, worst, worstPage, pages: expect };
  } finally { out.destroy(); }
}

/* ---------- 용량 제한에 맞게 나누기 ---------- */
async function partBytes(src, from, to) {
  const d = await PDFDocument.create();
  const idx = []; for (let i = from; i <= to; i++) idx.push(i);
  (await d.copyPages(src, idx)).forEach((p) => d.addPage(p));
  return d.save({ useObjectStreams: true, objectsPerTick: Infinity });
}
/** 앞쪽부터 제한 안에 들어가는 가장 긴 구간을 찾아 차례로 자른다(늘려 보다 넘으면 이분 탐색). 쪽 번호는 0부터. */
async function splitByLimit(bytes, limit, onStep) {
  const src = await PDFDocument.load(bytes, { updateMetadata: false, objectsPerTick: Infinity });
  const n = src.getPageCount(), parts = [];
  let s = 0;
  while (s < n) {
    onStep && onStep(s + 1, n);
    let best = { e: s, bytes: await partBytes(src, s, s) };
    if (best.bytes.length > limit) { parts.push({ from: s, to: s, bytes: best.bytes, over: true }); s++; continue; }
    let step = 1;
    while (best.e < n - 1) {
      const e = Math.min(n - 1, best.e + step);
      const b = await partBytes(src, s, e);
      if (b.length <= limit) { best = { e, bytes: b }; step *= 2; continue; }
      let lo = best.e + 1, hi = e - 1;
      while (lo <= hi) {
        const m = (lo + hi) >> 1, bb = await partBytes(src, s, m);
        if (bb.length <= limit) { best = { e: m, bytes: bb }; lo = m + 1; } else hi = m - 1;
      }
      break;
    }
    parts.push({ from: s, to: best.e, bytes: best.bytes });
    s = best.e + 1;
  }
  return parts;
}

/** 제한은 1MB = 1,000,000 바이트로 잡는다 — 사이트마다 1,048,576 으로 보기도 하는데, 작은 쪽에 맞추면 둘 다 통과한다. */
function limitBytes() {
  const v = $("limit").value;
  if (v === "custom") { const mb = parseFloat($("limitCustom").value); return mb > 0 ? Math.floor(mb * 1e6) : 0; }
  return v ? Math.floor(parseFloat(v) * 1e6) : 0;
}
const fmtLimit = (b) => (b / 1e6).toFixed(b % 1e6 ? 1 : 0) + " MB";
$("limit").addEventListener("change", () => { $("limitCustom").style.display = $("limit").value === "custom" ? "block" : "none"; });

function download(bytes, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- 실행 ---------- */
let outParts = null; // 나눈 경우 [{from,to,bytes,over}]
$("run").addEventListener("click", async () => {
  if (!srcBytes) return;
  showErr(""); showNote("");
  $("run").disabled = true; $("download").disabled = true; $("download").style.display = ""; $("parts").innerHTML = ""; outParts = null; outBlob = null;
  const t0 = performance.now();
  const limit = limitBytes();
  const notes = [];
  let srcDoc = null;
  try {
    let lv = level;
    let r = mode === "images" ? await compressImages(srcBytes.slice(), PRESETS.images[lv]) : await rasterize(srcBytes, PRESETS.raster[lv]);
    // 제한을 넘으면 한 단계씩 더 강하게(바꾼 사실은 화면에 알린다)
    const order = ["light", "medium", "strong"];
    while (limit && r.out.length > limit && order.indexOf(lv) < 2) {
      lv = order[order.indexOf(lv) + 1];
      notes.push(t().escalated(t()["lv" + (order.indexOf(lv) + 1)]));
      r = mode === "images" ? await compressImages(srcBytes.slice(), PRESETS.images[lv]) : await rasterize(srcBytes, PRESETS.raster[lv]);
    }
    let best = r.out;
    const before = srcBytes.length;
    if (best.length >= before) best = srcBytes; // 안 줄었으면 원본 그대로 이어서(나누기만 할 수도 있다)

    srcDoc = await pdfjsLib.getDocument({ data: srcBytes.slice(), worker: pdfWorker }).promise;
    const tc = performance.now();
    if (best !== srcBytes) {
      const v = await verify(srcDoc, best, 1, srcDoc.numPages, (i, n) => setStatus(t().verifying(i, n), i / n));
      if (!v.ok) { // 깨졌으면 결과를 버리고 원본 유지
        showErr(t().verifyFail(v.worstPage || "?")); setStatus("", null);
        window.__pdfcResult = { before, after: before, verify: v, failed: true }; return;
      }
      notes.push(t().verifyOk(v.pages));
    }
    lap("check", tc);
    const check = await pdfjsLib.getDocument({ data: best.slice(), worker: pdfWorker }).promise;
    await drawThumb(check); check.destroy();

    const after = best.length, pct = (after - before) / before * 100;
    $("iPages").textContent = srcDoc.numPages;
    $("iNew").textContent = fmt(after);
    $("iDelta").innerHTML = `<span class="${after < before ? "down" : "up"}">${pct > 0 ? "+" : ""}${pct.toFixed(1)}%</span>`;
    $("iDone").textContent = r.info + " · " + ((performance.now() - t0) / 1000).toFixed(1) + "s";

    if (limit && after > limit) {
      // 그래도 크면 제한에 맞게 나눈다 — 나눈 파일도 하나씩 검사
      const parts = await splitByLimit(best, limit, (i, n) => setStatus(t().splitting(i, n), i / n));
      for (const p of parts) {
        const v = await verify(srcDoc, p.bytes, p.from + 1, p.to + 1);
        if (!v.ok) { showErr(t().verifyFail(v.worstPage || "?")); return; }
      }
      outParts = parts;
      $("download").style.display = "none"; // 나눈 경우엔 파일별 단추만
      const box = $("parts");
      parts.forEach((p, i) => {
        const b = document.createElement("button");
        b.className = "btn part" + (p.over ? " over" : "");
        b.textContent = t().partLabel(i + 1, p.from + 1, p.to + 1, fmt(p.bytes.length));
        b.addEventListener("click", () => download(p.bytes, srcFile.name.replace(/\.pdf$/i, "") + t().suffix + `-${i + 1}.pdf`));
        box.appendChild(b);
      });
      notes.push(t().splitDone(parts.length, fmtLimit(limit)));
      if (parts.some((p) => p.over)) notes.push(t().pageOver);
    } else if (after < before) {
      outBlob = new Blob([best], { type: "application/pdf" }); $("download").disabled = false;
      if (limit) notes.push(t().underLimit(fmtLimit(limit)));
    } else {
      notes.push(mode === "images" && r.images === 0 ? t().noImages : t().noGain);
    }
    if (mode === "images" && r.done === 0 && after < before) notes.push(t().noImages);
    showNote(notes.join(" "));
    window.__pdfcOut = best; window.__pdfcParts = outParts; window.__pdfjs = pdfjsLib; // 시험·디버그용(결과 비교)
    window.__pdfcResult = { before, after, pct, ms: Math.round(performance.now() - t0), mode, level: lv, pages: srcDoc.numPages, info: r.info, phases: { ...T },
      parts: outParts ? outParts.map((p) => ({ from: p.from + 1, to: p.to + 1, size: p.bytes.length, over: !!p.over })) : null, notes };
    for (const k in T) delete T[k];
    setStatus(t().done, null);
    $("reset").style.display = "block";
  } catch (e) {
    console.error(e);
    showErr(e && /encrypt/i.test(String(e.message || e)) ? t().errEnc : t().errMem);
    setStatus("", null);
  } finally {
    srcDoc && srcDoc.destroy();
    $("run").disabled = false;
  }
});
$("download").addEventListener("click", () => {
  if (!outBlob) return;
  outBlob.arrayBuffer().then((b) => download(new Uint8Array(b), srcFile.name.replace(/\.pdf$/i, "") + t().suffix + ".pdf"));
});
$("reset").addEventListener("click", () => {
  srcFile = srcBytes = outBlob = outParts = null; input.value = "";
  $("info").style.display = "none"; $("download").disabled = true; $("run").disabled = true; $("reset").style.display = "none";
  $("parts").innerHTML = ""; $("download").style.display = "";
  $("preview").innerHTML = `<div class="empty">${t().waiting}</div>`; $("dropSmall").textContent = ".pdf";
  showErr(""); showNote(""); setStatus("", null);
});
applyLang();
// 사이트 페이지에 iframe 으로 들어가 있으면 내용 높이를 알려 준다 — 부모가 iframe 높이를 맞춘다(안쪽 스크롤 없이)
if (window.parent !== window) {
  // 내용 상자(.wrap)의 높이만 잰다. documentElement.scrollHeight 는 틀(iframe) 높이보다 작아지지 않고,
  // body 의 min-height:100vh 때문에 틀이 커지면 그대로 다시 보고돼 아래에 빈 공간이 남았다(2026-10-06 사용자 화면).
  document.documentElement.classList.add("embedded");
  const wrap = document.querySelector(".wrap");
  let last = 0, timer = 0;
  const post = () => {
    const h = Math.ceil(wrap.getBoundingClientRect().height);
    if (h !== last) { last = h; window.parent.postMessage({ pdfcHeight: h }, location.origin); }
  };
  const soon = () => { clearTimeout(timer); timer = setTimeout(post, 30); };
  // ResizeObserver 는 화면을 다시 그릴 때만 돈다(가려진 창에선 멈춤) — 내용 변화·창 크기 변화로도 다시 잰다
  new ResizeObserver(soon).observe(wrap);
  new MutationObserver(soon).observe(wrap, { subtree: true, childList: true, attributes: true, characterData: true });
  window.addEventListener("resize", soon);
  window.addEventListener("load", post);
  window.addEventListener("message", (e) => { if (e.origin === location.origin && e.data && e.data.pdfcAsk) { last = 0; post(); } }); // 부모가 늦게 준비되면 다시 묻는다
}
</script>
</body>
